<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skykeen Events | Contact</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Main CSS -->
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body>
  <!-- Loaded via components.js -->
  <div id="header"></div>

  <main>
    <!-- HERO -->
    <section class="page-hero">
      <div class="container">
        <h1>Contact Us</h1>
        <p class="breadcrumb">Home <span>/</span> Contact Us</p>
      </div>
    </section>

    <!-- CONTACT -->
    <section class="section bg-light" id="contact">
      <div class="container contact-grid">

        <!-- LEFT -->
        <div class="contact-left reveal">
          <span class="sub-title">Get in Touch</span>
          <h2>Talk to Our Team</h2>
          <p class="lead">
            Workshops • Competitions • Brand Activation • Flea Marketing
          </p>

          <div class="contact-info-wrapper">
            <div class="contact-item">
              <div class="icon-box"><i class="fa-solid fa-envelope"></i></div>
              <div class="info-text">
                <span class="label">Email</span>
                <p>hello@eventpro.com</p>
              </div>
            </div>

            <div class="contact-item">
              <div class="icon-box"><i class="fa-solid fa-phone"></i></div>
              <div class="info-text">
                <span class="label">Phone</span>
                <p>+91 7406238503</p>
              </div>
            </div>

            <div class="contact-item">
              <div class="icon-box"><i class="fa-solid fa-location-dot"></i></div>
              <div class="info-text">
                <span class="label">Location</span>
                <p>Bengaluru, India</p>
              </div>
            </div>
          </div>
        </div>

        <!-- RIGHT -->
        <div class="contact-right reveal delay-2">
          <div class="contact-card">
            <form class="styled-form js-sheet-form" id="contactForm">
              <input type="hidden" name="source" value="contact-page">

              <div class="form-row-grid">
                <div class="form-group">
                  <label>Your Name</label>
                  <div class="input-wrap">
                    <i class="fa-solid fa-user"></i>
                    <input name="name" type="text" placeholder="John Doe" required>
                  </div>
                </div>

                <div class="form-group">
                  <label>Email Address</label>
                  <div class="input-wrap">
                    <i class="fa-solid fa-envelope"></i>
                    <input name="email" type="email" placeholder="john@example.com" required>
                  </div>
                </div>
              </div>

              <div class="form-group">
                <label>Phone</label>
                <div class="input-wrap">
                  <i class="fa-solid fa-phone"></i>
                  <input name="phone" type="tel" placeholder="+91 9XXXXXXXXX" required>
                </div>
              </div>

              <div class="form-group">
                <label>Event Type</label>
                <div class="input-wrap">
                  <i class="fa-solid fa-calendar-check"></i>
                  <input name="eventType" type="text" placeholder="Workshop / Brand Activation / Flea Marketing..." required>
                </div>
              </div>

              <div class="form-group">
                <label>Your Message</label>
                <div class="input-wrap textarea">
                  <i class="fa-solid fa-pen-to-square"></i>
                  <textarea name="message" placeholder="Tell us about your event..." rows="5"></textarea>
                </div>
              </div>

              <button type="submit" class="btn btn-primary full-width">
                Send Message <i class="fa-solid fa-arrow-up-right-from-square"></i>
              </button>

              <p class="form-status" aria-live="polite"></p>
            </form>
          </div>
        </div>

      </div>
    </section>

    <!-- MAP -->
    <section class="map-section">
      <iframe
        src="https://www.google.com/maps?q=Bengaluru,India&output=embed"
        allowfullscreen=""
        loading="lazy">
      </iframe>
    </section>
  </main>

  <!-- Loaded via components.js -->
  <div id="footer"></div>


<!-- POPUP FORM -->
 
<div class="popup-overlay" id="popupOverlay">
  <div class="popup-card">
    <button class="popup-close" id="popupClose">×</button>

    <h3 class="popup-title">Get a Free Callback</h3>
    <p class="popup-sub">Share your details — we’ll contact you shortly.</p>

      <form class="styled-form js-sheet-form" id="popupForm">
  <input type="hidden" name="source" value="popup-form">

  <div class="form-group">
    <label>Name</label>
    <div class="input-wrap">
      <i class="fa-solid fa-user"></i>
      <input name="name" type="text" placeholder="Your name" required>
    </div>
  </div>

  <div class="form-group">
    <label>Phone</label>
    <div class="input-wrap">
      <i class="fa-solid fa-phone"></i>
      <input name="phone" type="tel" placeholder="Your phone number" required>
    </div>
  </div>

  <div class="form-group">
    <label>Event Type</label>
    <div class="input-wrap">
      <i class="fa-solid fa-calendar-check"></i>
      <input name="eventType" type="text" placeholder="Workshop / Brand Activation / Flea Marketing...">
    </div>
  </div>

  <button class="btn btn-primary full-width" type="submit">
    Request Callback <i class="fa-solid fa-arrow-up-right-from-square"></i>
  </button>

  <p class="form-status" aria-live="polite"></p>
</form>
  </div>
</div>
  <!-- JS -->
  <script src="../js/components.js"></script>
  <script src="../js/reveal.js"></script>
  <script src="../js/forms.js"></script>
  <script src="../js/popup.js"></script>
</body>
</html>
