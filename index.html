<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - Skykeen Events</title>
    <style>
        /* RESET & BASICS */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            background: #1a1a1a; /* Dark Background */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .container { max-width: 800px; width: 100%; }

        /* LOGO */
        .logo-container { margin-bottom: 30px; }
        .logo-container img {
            max-width: 180px;
            width: 100%; /* Ensures logo scales down on tiny screens */
            height: auto;
        }

        /* HEADINGS */
        h1 {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #ff6600; /* Your Brand Orange */
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1.2;
        }

        p {
            font-size: 1.1rem;
            color: #cccccc;
            margin-bottom: 40px;
            padding: 0 10px; /* Prevents text hitting edges on mobile */
        }

        /* --- COUNTDOWN STYLES --- */
        #countdown {
            display: flex;
            justify-content: center;
            gap: 20px; /* Default gap for desktop */
            margin-bottom: 40px;
            flex-wrap: wrap; 
        }

        .time-box {
            background: #333;
            padding: 20px;
            border-radius: 8px;
            min-width: 100px;
            border-bottom: 4px solid #ff6600; /* Orange accent */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .time-box span {
            display: block;
            font-size: 2.5rem;
            font-weight: bold;
            color: #fff;
            line-height: 1;
        }

        .time-box .label {
            font-size: 0.9rem;
            color: #aaa;
            text-transform: uppercase;
            margin-top: 8px;
            font-weight: normal;
        }

        /* LOADER */
        .loader {
            width: 60px;
            height: 4px;
            background: #333;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            border-radius: 5px;
        }
        .loader::after {
            content: '';
            position: absolute;
            left: -50%;
            height: 100%;
            width: 50%;
            background: #ff6600;
            animation: loading 2s infinite linear;
        }
        @keyframes loading {
            0% { left: -50%; }
            100% { left: 100%; }
        }

        /* FOOTER */
        .footer {
            margin-top: 50px;
            font-size: 0.9rem;
            color: #666;
        }

        /* --- MOBILE RESPONSIVE OPTIMIZATIONS --- */
        @media (max-width: 600px) {
            body {
                padding: 15px; /* Reduce outer padding */
            }

            h1 { font-size: 1.8rem; margin-bottom: 10px; }
            
            p { font-size: 0.95rem; margin-bottom: 30px; }

            #countdown { 
                gap: 8px; /* Tighter gap for mobile */
                width: 100%; /* Ensure full width usage */
            }

            .time-box { 
                /* Crucial: Share space equally */
                flex: 1; 
                min-width: 0; /* Allows shrinking below content size if strictly needed */
                padding: 15px 5px; /* Less horizontal padding */
            }

            .time-box span { font-size: 1.6rem; }
            .time-box .label { font-size: 0.65rem; margin-top: 4px; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="logo-container">
            <img src="image/logo.png" alt="Skykeen Events Logo">
        </div>

        <h1>We Are Launching Soon</h1>
        <p>Our website is currently under construction. We'll be here in:</p>

        <div id="countdown">
            <div class="time-box"><span id="days">00</span><div class="label">Days</div></div>
            <div class="time-box"><span id="hours">00</span><div class="label">Hours</div></div>
            <div class="time-box"><span id="minutes">00</span><div class="label">Minutes</div></div>
            <div class="time-box"><span id="seconds">00</span><div class="label">Seconds</div></div>
        </div>

        <div class="loader"></div>

        <div class="footer">
            &copy; 2026 Skykeen Events. All Rights Reserved.
        </div>
    </div>

    <script>
        // 1. SET THE DATE:
        // Currently set to 5 days from now
        
        var targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + 5); 
        var countDownDate = targetDate.getTime();

        // 2. Update the count down every 1 second
        var x = setInterval(function() {

            var now = new Date().getTime();
            var distance = countDownDate - now;

            var days = Math.floor(distance / (1000 * 60 * 60 * 24));
            var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            var seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Helper function to add leading zero (e.g. "09" instead of "9")
            function formatTime(time) {
                return time < 10 ? "0" + time : time;
            }

            document.getElementById("days").innerHTML = formatTime(days);
            document.getElementById("hours").innerHTML = formatTime(hours);
            document.getElementById("minutes").innerHTML = formatTime(minutes);
            document.getElementById("seconds").innerHTML = formatTime(seconds);

            if (distance < 0) {
                clearInterval(x);
                document.getElementById("countdown").innerHTML = "<h2>WE ARE LIVE!</h2>";
            }
        }, 1000);
    </script>

</body>
</html>
